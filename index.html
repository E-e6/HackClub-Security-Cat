<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hack Cat Security 🐱🔒</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-800 to-blue-700 text-white min-h-screen flex flex-col items-center justify-center p-6">

  <div class="bg-black/40 p-8 rounded-2xl shadow-2xl max-w-lg text-center">
    <h1 class="text-4xl font-extrabold mb-4">🐱 Hack Cat Security</h1>
    <p class="mb-6 text-lg">Welcome human. I, the Hack Cat, will audit your cookies 🍪…</p>

    <button id="scanBtn" class="px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white rounded-xl shadow-md transition">Start Security Scan</button>

    <div id="scanOutput" class="mt-6 hidden">
      <p class="text-yellow-300 text-xl font-bold animate-pulse">🔍 Scanning your snacks...</p>
    </div>

    <div id="result" class="mt-6 hidden">
      <p class="text-green-400 text-xl font-semibold">✅ Your cookies are secure!</p>
      <p class="text-sm mt-2">Tip: Always use <span class="underline">2FA</span> (not 2Fish 🐟)</p>
      <div class="mt-4 p-4 bg-green-700 rounded-xl">🎖️ You earned: <strong>Cat Approved Badge</strong></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
